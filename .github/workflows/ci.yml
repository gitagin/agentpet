name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install backend
        run: python -m pip install -e "apps/backend"

      - name: Install test tooling
        run: python -m pip install pytest ruff

      - name: Lint backend
        run: ruff check apps/backend/app --select A001

      - name: Download local embedding model
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/download-embedding-model.ps1

      - name: Backend tests
        run: python -m pytest apps/backend/tests -q

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop deps
        run: npm ci
        working-directory: apps/desktop

      - name: Desktop typecheck
        run: npm run typecheck
        working-directory: apps/desktop
