[project]
name = "agent-pet-backend"
version = "0.0.1a0"
description = "FastAPI sidecar for Agent Pet"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.7.4,<3",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "APScheduler>=3.10,<4",
  "SQLAlchemy>=2.0,<3",
  "langchain>=1.2,<1.3",
  "langchain-openai>=1.1.14,<2",
  "langgraph>=1.1.5,<1.2",
]

[project.optional-dependencies]
vector = [
  "langchain-qdrant>=1.1,<2",
  "qdrant-client>=1.16,<2",
  "kuzu>=0.11,<1",
]
packaging = [
  "pyinstaller>=6.3,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]
