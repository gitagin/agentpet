[project]
name = "agent-pet-backend"
version = "0.0.1a0"
description = "FastAPI sidecar for Agent Pet"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.7.4,<3",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "tzlocal>=5.2,<6",
  "APScheduler>=3.10,<4",
  "SQLAlchemy>=2.0,<3",
  "langchain>=1.2,<1.3",
  "langchain-openai>=1.1.14,<2",
  "langgraph>=1.1.5,<1.2",
]

[project.optional-dependencies]
vector = [
  "langchain-qdrant>=1.1,<2",
  "qdrant-client>=1.16,<2",
]
# 注意：kuzu 不放进 vector extra —— 它是图投影的选配依赖，且打包构建
# （scripts/build-sidecar.ps1）明确排除它；放进 extra 会误导安装并造成
# "打包后静默降级"的假象。
local-vector = [
  "onnxruntime>=1.17,<2",
  "tokenizers>=0.15,<1",
]
packaging = [
  "pyinstaller>=6.3,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["A001", "E9", "F63", "F7", "F82"]
