[project]
name = "agent-pet-backend"
version = "0.0.1a0"
description = "FastAPI sidecar for Agent Pet"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.7.4,<3",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "APScheduler>=3.10,<4",
  "SQLAlchemy>=2.0,<3",
  "langchain>=1.2,<1.3",
  "langchain-openai>=1.1.14,<2",
  "langchain-qdrant>=1.1,<2",
  "langgraph>=1.1.5,<1.2",
  "qdrant-client>=1.16,<2",
  "kuzu>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["app/"]
strict = false
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "apscheduler.*",
  "langchain.*",
  "langchain_core.*",
  "langgraph.*",
  "qdrant_client.*",
  "kuzu.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
markers = [
  "live_model: optional acceptance gate that requires LIVE_MODEL_BASE_URL, LIVE_CHAT_MODEL, and LIVE_MODEL_API_KEY",
]
