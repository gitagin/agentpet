[project]
name = "agent-pet-backend"
version = "0.0.1a0"
description = "FastAPI sidecar for Agent Pet"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.7.4,<3",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "APScheduler>=3.10,<4",
  "SQLAlchemy>=2.0,<3",
  "langchain>=1.2,<1.3",
  "langchain-openai>=1.1.14,<2",
  "langgraph>=1.1.5,<1.2",
]

[project.optional-dependencies]
# Optional acceleration layer for the vector/graph retrieval channels.
# The production default path is FTS; every qdrant/kuzu import in the code
# is lazy and degrades gracefully when these packages are absent.
vector = [
  "langchain-qdrant>=1.1,<2",
  "qdrant-client>=1.16,<2",
  "kuzu>=0.11,<1",
]
dev = [
  "langchain-qdrant>=1.1,<2",
  "qdrant-client>=1.16,<2",
  "kuzu>=0.11,<1",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
# Backlog item #10: real gates. F (pyflakes), B (bugbear), A (builtins
# shadowing) calibrated against the 2026-07 violation inventory; E9 keeps
# syntax-level errors fatal.
select = ["E9", "F", "B", "A"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts call expressions in parameter
# defaults (Depends()/Query()/...) by design — not the mutable-default bug
# that B008 exists to catch.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy star-import hub inside the wiki package: frozen HERE so new star
# imports anywhere else still fail lint. F401 must stay frozen too — the
# imports in common.py exist to be re-exported to the star-importing
# siblings, and `ruff --fix` deleting them broke the whole package at
# import time (2026-07-26 incident). Unwind together with backlog #14.
"app/services/wiki/*.py" = ["F401", "F403", "F405"]
"app/models/api/__init__.py" = ["F403"]

[tool.mypy]
python_version = "3.10"
files = ["app/"]
strict = false
ignore_missing_imports = true
follow_imports = "normal"
# Stays off until the ratchet below is burned down: the 2026-07-26 baseline
# was measured without stale-ignore warnings, and enabling them would add
# errors the ratchet does not account for.
warn_unused_ignores = false
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "apscheduler.*",
  "langchain.*",
  "langchain_core.*",
  "langgraph.*",
  "qdrant_client.*",
  "kuzu.*",
]
ignore_missing_imports = true

# ---- Type-debt ratchet (backlog #10) ----
# Baseline 2026-07-26 (mypy-report.txt): 1369 errors across the 102
# modules below. They are SUPPRESSED here so that every other module — the
# 80 files that were already clean, plus all future code — is type-checked
# for real by the CI mypy step. Pay the debt down by fixing a module and
