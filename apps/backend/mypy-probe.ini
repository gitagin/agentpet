# Probe config for backlog item #10 (make mypy a real gate).
#
# The main pyproject config still carries ignore_errors=true, which makes the
# CI "type check" step unable to fail by construction. This probe reports the
# REAL error inventory so the tightening plan can be calibrated per module
# instead of guessed:
#
#     mypy --config-file mypy-probe.ini app/ > mypy-report.txt
#
# Once per-module gates land in pyproject.toml, this file can be deleted.
[mypy]
python_version = 3.10
show_error_codes = True
ignore_missing_imports = True
follow_imports = normal

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-langchain_core.*]
ignore_missing_imports = True

[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-kuzu.*]
ignore_missing_imports = True
